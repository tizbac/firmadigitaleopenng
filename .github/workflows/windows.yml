name: windows

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/windows/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'packaging/windows/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows x64 installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Docker (Fedora mingw64) and package with NSIS
        run: |
          docker build --target win-package -t fdo-win .
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/out" fdo-win

      - name: Show artifacts
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
